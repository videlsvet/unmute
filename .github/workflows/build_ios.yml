name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Flutter and Pods
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
          flutter build ios --config-only --release
          cd ios
          pod install
          cd ..

      - name: Build iOS Archive (xcodebuild unsigned)
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA for Sideloading
        run: |
          mkdir -p Payload
          cp -r build/ios/Runner.xcarchive/Products/Applications/Runner.app Payload/
          zip -r -y Unmute.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Unmute-iOS-IPA
          path: Unmute.ipa
          retention-days: 7
